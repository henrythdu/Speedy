name = "ui-terminal"
purpose = "Terminal surface + TUI lifecycle: TuiManager runs the ratatui event/render loop."
provides = ["TuiManager"]
requires = [
  "app",
  "autocomplete",
  "config-popup",
  "kitty",
  "reader",
  "reading",  # terminal.rs calls calculate_anchor_position/calculate_sentence_progress (crossing hidden by cells rust-importer bug; lands when fixed)
  "rendering",
  "ui-events",
  "ui-theme",
]
layer = 4
