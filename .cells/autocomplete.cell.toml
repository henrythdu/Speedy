name = "autocomplete"
layer = 4
purpose = "File autocomplete for the command deck (@-trigger): threaded background discovery, per-directory cache (TTL), popup state, and ratatui rendering of matching PDF/EPUB files."
provides = [
  "AutocompleteState",
  "DiscoveryHandle",
  "spawn_discovery_thread",
  "PerDirectoryCache",
  "render_autocomplete_popup",
  "is_supported_file",
]
requires = ["ui-theme"]
