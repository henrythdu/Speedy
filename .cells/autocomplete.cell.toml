name = "autocomplete"
layer = 4
purpose = "File autocomplete subsystem (@-trigger): a controller owning popup state + threaded background discovery + per-directory cache (TTL), plus ratatui rendering of matching PDF/EPUB files. The controller exposes the high-level actions the command-deck key loop needs."
provides = [
  "AutocompleteController",
  "AutocompleteState",
  "DiscoveryHandle",
  "spawn_discovery_thread",
  "PerDirectoryCache",
  "render_autocomplete_popup",
  "is_supported_file",
]
requires = ["ui-theme"]
